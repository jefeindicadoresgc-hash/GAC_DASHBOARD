<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMS Service - Acceso Corporativo</title>
    <!-- Cargamos el motor visual base -->
    <link rel="stylesheet" href="css/global.css">
</head>

<body>
    <div class="login-container">
        <!-- Tarjeta con efecto cristal -->
        <div class="glass-card login-box">
            <h1>DMS <span>Corporate</span></h1>
            <p>GAC Motor & Great Wall Motors</p>

            <div style="margin-top: 20px;">
                <input type="password" id="loginCode" placeholder="Ingresa tu código de acceso..." autocomplete="off"
                    style="text-align: center; font-size: 18px; letter-spacing: 2px;">
                <button id="btnLogin" class="btn-primary">Ingresar al Sistema</button>

                <!-- Mensaje de error oculto por defecto -->
                <p id="errorMsg" class="error-text">⚠️ Código de acceso no válido.</p>
            </div>

            <div style="margin-top: 30px; font-size: 11px; color: #94a3b8;">
                V. 2.0 | Coatzacoalcos, Ver.
            </div>
        </div>
    </div>

    <!-- Cargamos el controlador de accesos -->
    <script src="js/login.js"></script>
</body>

</html>
